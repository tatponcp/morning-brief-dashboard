name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: ติดตั้ง dependency
        run: npm ci --ignore-scripts

      - name: ตรวจชนิดข้อมูล
        run: npx tsc --noEmit

      - name: ตรวจโค้ด
        run: npx eslint src

      - name: build
        run: npm run build
        env:
          # ไม่ใส่ค่าจริง — แค่ให้ build ผ่านเหมือนตอน production
          NEXT_TELEMETRY_DISABLED: "1"
